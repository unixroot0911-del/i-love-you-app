name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Web files
        run: |
          mkdir www
          cp index.html firebase-config.js shim.js manifest.webmanifest sw.js icon-192.png icon-512.png www/
      - name: Capacitor
        run: |
          npm init -y > /dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "I Love You" com.loveyou.app --web-dir=www
          npx cap add android
          cp -r android-icons/* android/app/src/main/res/
          rm -f android/app/src/main/res/mipmap-anydpi-v26/*.xml
          npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ILoveYou.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest ILoveYou.apk --title "I Love You (Android)" --notes "Install this APK on Android."
