<script>
(function(){
var cv=document.getElementById('c'),x=cv.getContext('2d'),dv=document.getElementById('d'),dx=dv.getContext('2d'),W,H,D=Math.min(devicePixelRatio||1,2),dirty=true;

rs();addEventListener('resize',rs);
var R=Math.random,pts=[],N=1100,start=performance.now(),boost=0,pm={x:0,y:0,on:false};

sp.push({x:bx,y:by,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,l:1,h:R()<.45,c:R()<.5?'#ff4d79':(R()<.5?'#ffd9a0':'#ffc2d4'),s:R()*9+5})}}
var h=document.getElementById('h'),txt='I love you';
for(i=0;i<txt.length;i++){var s=document.createElement('span');
s.textContent=txt[i]===' '?'\u00a0':txt[i];s.style.animationDelay=(3.2+i*.2)+'s';h.appendChild(s)}

/* ---------- shared ink: draw + write, saved forever ---------- */
var gd=new Map(),gcol=null,uid=null,ink=new Map(),mine=new Set(),col=null,canWrite=true,color='#ff4d79',wd=5,mode='pen',cur=null,st=null,chipEl=document.getElementById('chip');

function fail(){canWrite=false;chip('could not save, check your connection')}
if(window.claude&&claude.use)claude.use('user').then(function(u){return u&&u.id?u.id():null}).then(function(v){uid=v||null}).catch(function(){});
(window.claude&&claude.use?claude.use('db'):Promise.resolve(null)).then(function(d){

gcol.onSnapshot(function(sn){sn.docChanges().forEach(function(c){if(c.type==='removed')gd.delete(c.doc.id);else gd.set(c.doc.id,c.doc.data())})},function(){});
var tm=setTimeout(function(){chip('saved drawings are not reachable yet')},10000);
col.orderBy('t').onSnapshot(function(sn){
if(!(sn.metadata&&sn.metadata.fromCache)){clearTimeout(tm);if(canWrite)chip('')}

dirty=true},function(){clearTimeout(tm);chip('saved drawings unavailable')});
}).catch(function(){canWrite=false;chip('offline mode')});

function nid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function save(c){if(!col||!canWrite)return;c.dirty=true;if(c.busy)return;c.busy=true;
(function go(){c.dirty=false;
col.doc(c.id).set({k:c.o.k,o:c.o.o||null,c:c.o.c,w:c.o.w,t:c.o.t,p:c.o.p.slice(),v:c.o.v||null,x:c.o.x||0,y:c.o.y||0,s:c.o.s||0}).catch(fail).then(function(){
if(c.dirty)go();else{c.busy=false;if(c.done)mine.delete(c.id)}})})()}
function sched(c){if(c.tm)return;c.tm=setTimeout(function(){c.tm=0;save(c)},140)}
function newStroke(px,py){var id=nid(),o={k:'s',o:uid,c:color,w:wd,t:Date.now(),p:[Math.round(px/W*1000),Math.round(py/W*1000)]};
ink.set(id,o);mine.add(id);cur={id:id,o:o,lx:px,ly:py};dirty=true;sched(cur)}
function finish(){if(!cur)return;var c=cur;cur=null;c.done=true;clearTimeout(c.tm);c.tm=0;save(c);if(!col)mine.delete(c.id)}
function addPt(px,py){if(Math.hypot(px-cur.lx,py-cur.ly)<2)return;
cur.o.p.push(Math.round(px/W*1000),Math.round(py/W*1000));cur.lx=px;cur.ly=py;dirty=true;sched(cur);
if(R()<.18)sp.push({x:px,y:py,vx:(R()-.5)*1.2,vy:-R()*1.4,l:.8,h:true,c:color,s:7+R()*5});
if(cur.o.p.length>2400){finish();newStroke(px,py)}}

dv.addEventListener('pointerdown',function(e){
try{dv.setPointerCapture(e.pointerId)}catch(_){}
if(mode==='text'){openText(e.clientX,e.clientY);return}
if(mode==='garden'){gtap(e.clientX,e.clientY);return}
if(mode.indexOf('erase')===0){st=null;cur=null;pm.on=true;pm.x=e.clientX;pm.y=e.clientY;erase(e.clientX,e.clientY);dirty=true;return}
st={x:e.clientX,y:e.clientY};cur=null;pm.on=true;pm.x=e.clientX;pm.y=e.clientY});
dv.addEventListener('pointermove',function(e){pm.x=e.clientX;pm.y=e.clientY;if(pm.on&&mode.indexOf('erase')===0){erase(e.clientX,e.clientY);dirty=true;return}if(!st)return;
if(!cur){if(Math.hypot(e.clientX-st.x,e.clientY-st.y)<8)return;newStroke(st.x,st.y)}
addPt(e.clientX,e.clientY)});
function up(e){pm.on=false;dirty=true;if(!st)return;if(!cur){burst(e.clientX,e.clientY);boost=1}else finish();st=null}
dv.addEventListener('pointerup',up);dv.addEventListener('pointercancel',up);

function openText(px,py){var old=document.getElementById('ti');if(old)old.blur();
var fpx=Math.max(28,Math.min(52,W*.07)),ip=document.createElement('input'),done=false;
ip.id='ti';ip.maxLength=80;ip.placeholder='write here';ip.style.cssText='left:'+px+'px;top:'+(py-fpx*.8)+'px;font-size:'+fpx+'px;color:'+color;
function commit(ok){if(done)return;done=true;var v=ip.value.trim();ip.remove();
if(ok&&v){var id=nid(),o={k:'t',o:uid,c:color,w:0,t:Date.now(),p:[],v:v,x:Math.round(px/W*1000),y:Math.round(py/W*1000),s:Math.round(fpx/W*1000*10)/10};
ink.set(id,o);dirty=true;var c={id:id,o:o,done:true};mine.add(id);save(c);if(!col)mine.delete(id)}}
ip.addEventListener('keydown',function(e){if(e.key==='Enter')commit(true);if(e.key==='Escape')commit(false)});
ip.addEventListener('blur',function(){commit(true)});
document.body.appendChild(ip);setTimeout(function(){ip.focus()},0)}

var tb=document.getElementById('tb'),szb=document.getElementById('sz'),szs=[4,8,14],szi=0;
function szUi(){var i2=szb.firstChild;i2.style.width=i2.style.height=(4+szi*4)+'px';wd=szs[szi]}szUi();
tb.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
if(b.id==='sz'){szi=(szi+1)%3;szUi();return}
if(b.dataset.m){mode=b.dataset.m;tb.querySelectorAll('[data-m]').forEach(function(z){z.classList.toggle('on',z===b)});dv.style.cursor=mode==='text'?'text':(mode.indexOf('erase')===0?'cell':'crosshair');if(mode==='garden')tchip('plant a seed on the soil. only your love can water it');if(mode==='erase')tchip('smart eraser: removes only what you drew');if(mode==='erase-all')tchip('strong eraser: erases everything, for both of you')}
if(b.dataset.c){color=b.dataset.c;tb.querySelectorAll('.sw').forEach(function(z){z.classList.toggle('on',z===b)})}});

function dseg(px,py,ax,ay,bx,by){var u2=bx-ax,v2=by-ay,l=u2*u2+v2*v2,t=l?Math.max(0,Math.min(1,((px-ax)*u2+(py-ay)*v2)/l)):0;return Math.hypot(px-(ax+t*u2),py-(ay+t*v2))}
function erase(px,py){var all=mode==='erase-all',k=W/1000,r=Math.max(14,W*.03),dels=[];
ink.forEach(function(o,id){if(!all&&(!uid||o.o!==uid))return;var hit=false;
if(o.k==='t'){dx.font=(o.s*k)+'px "Great Vibes","Brush Script MT",cursive';var w=dx.measureText(o.v).width,fx=o.x*k,fy=o.y*k;hit=px>fx-r/2&&px<fx+w+r/2&&py>fy-o.s*k&&py<fy+o.s*k*.4}
else{var q=o.p||[];if(q.length<4)hit=q.length>1&&Math.hypot(px-q[0]*k,py-q[1]*k)<r;else for(var j=0;j<q.length-3&&!hit;j+=2)hit=dseg(px,py,q[j]*k,q[j+1]*k,q[j+2]*k,q[j+3]*k)<r}
if(hit)dels.push(id)});
dels.forEach(function(id){ink.delete(id);mine.delete(id);if(col&&canWrite)col.doc(id).delete().catch(fail)})}

/* ---------- our garden: a game that never ends ---------- */
var PAL=['#ff6fa0','#ffd9a0','#c79bff','#9ad7ff','#ff9a7a'];
function SC(){return Math.max(.7,Math.min(W,520)/400)}

if(best){if(!uid||!canWrite||!gcol){tchip('view only');return}
if((best.st||0)>=5){burst(px,py);boost=1;return}
if(best.o===uid){tchip('only your love can water this one');return}
if(Date.now()-(best.wt||0)<8000){tchip('give it a moment');return}
var ns=(best.st||0)+1,nw=Date.now();gd.set(bid,Object.assign({},best,{st:ns,wt:nw}));
for(j=0;j<14;j++)sp.push({x:px,y:py-30*sc,vx:(R()-.5)*3,vy:R()*2,l:.9,h:false,c:'#9ad7ff',s:3});
if(ns>=5){burst(px,py-50*sc);boost=1}
gcol.doc(bid).update({st:ns,wt:nw}).catch(fail);return}
if(py>gt-6&&py<H-86){if(!uid||!canWrite||!gcol){tchip('view only');return}
var wait=0;gd.forEach(function(o){if(o.o===uid&&(o.st||0)<5)wait++});
if(wait>=3){tchip('let your love water your seeds first');return}
var o2={o:uid,x:Math.round(px/W*1000),fy:Math.max(0,Math.min(1000,Math.round((py-gt)/(H-86-gt)*1000))),st:0,wt:0,k:Math.floor(R()*5),t:Date.now()},id=nid();
gd.set(id,o2);gcol.doc(id).set(o2).catch(fail);
for(j=0;j<8;j++)sp.push({x:px,y:py,vx:(R()-.5)*2,vy:-R()*2,l:.8,h:true,c:PAL[o2.k],s:8})}
else burst(px,py)}
function drawGarden(now){return;var on=mode==='garden';if(!on&&!gd.size)return;
var gt=H*.76,sc=SC(),bl=0;x.globalAlpha=1;
if(on){var g=x.createLinearGradient(0,gt-10,0,H);g.addColorStop(0,'rgba(255,77,121,0)');g.addColorStop(1,'rgba(110,25,70,.6)');x.fillStyle=g;x.fillRect(0,gt-10,W,H-gt+10)}
Array.from(gd.values()).sort(function(a,b){return a.fy-b.fy}).forEach(function(o){
var s=o.st||0,px=o.x/1000*W,py=gY(o.fy),hg=[0,16,32,48,60,68][s]*sc,sw=Math.sin(now/900+o.x)*3*sc*(s/5),tx=px+sw,ty=py-hg,c=PAL[(o.k||0)%5],a;
x.shadowBlur=0;x.fillStyle='rgba(60,20,40,.8)';x.beginPath();x.ellipse(px,py,9*sc,4*sc,0,0,6.3);x.fill();
if(s>0){x.strokeStyle='#7fd69a';x.lineWidth=2.2*sc;x.lineCap='round';x.beginPath();x.moveTo(px,py);x.quadraticCurveTo(px,py-hg/2,tx,ty);x.stroke();
if(s>=2){x.fillStyle='#7fd69a';x.beginPath();x.ellipse(px-7*sc+sw/2,py-hg*.45,6*sc,3*sc,-.6,0,6.3);x.fill();x.beginPath();x.ellipse(px+7*sc+sw/2,py-hg*.6,6*sc,3*sc,.6,0,6.3);x.fill()}}
x.shadowColor=c;x.shadowBlur=s>=4?16:0;x.fillStyle=c;

else if(s===3){x.beginPath();x.arc(tx,ty,5*sc,0,6.3);x.fill()}
else if(s===4){for(a=0;a<6;a++){x.beginPath();x.arc(tx+Math.cos(a*1.047)*7*sc,ty+Math.sin(a*1.047)*7*sc,5*sc,0,6.3);x.fill()}x.fillStyle='#fff3c4';x.beginPath();x.arc(tx,ty,4*sc,0,6.3);x.fill()}
else if(s===5){bl++;x.font=(34+3*Math.sin(now/400+o.x))*sc+'px serif';x.fillText('♥',tx,ty);if(R()<.012)sp.push({x:tx,y:ty,vx:R()-.5,vy:-1.2,l:.9,h:true,c:c,s:10})}
x.shadowBlur=0;
if(s<5&&uid){if(o.o===uid){x.strokeStyle='rgba(255,217,160,.6)';x.lineWidth=1.5;x.beginPath();x.ellipse(px,py,14*sc,6*sc,0,0,6.3);x.stroke()}
else{x.font=18*sc+'px serif';x.fillStyle='#fff';x.fillText('💧',px,ty-16*sc-Math.abs(Math.sin(now/500+o.x))*5)}}});
if(on){x.font='italic 15px Georgia,serif';x.fillStyle='#ffc2d4';x.textAlign='left';x.fillText('blooms: '+bl,14,H*.76-16);x.textAlign='center'}}

function paint(){dx.clearRect(0,0,W,H);var k=W/1000;
Array.from(ink.values()).sort(function(a,b){return a.t-b.t}).forEach(function(o){
dx.shadowColor=o.c;dx.shadowBlur=10;dx.strokeStyle=o.c;dx.fillStyle=o.c;
if(o.k==='t'){dx.font=(o.s*k)+'px "Great Vibes","Brush Script MT",cursive';dx.textAlign='left';dx.textBaseline='alphabetic';dx.fillText(o.v,o.x*k,o.y*k);return}

for(var j=2;j<q.length-2;j+=2){dx.quadraticCurveTo(q[j]*k,q[j+1]*k,(q[j]+q[j+2])/2*k,(q[j+1]+q[j+3])/2*k)}
dx.lineTo(q[q.length-2]*k,q[q.length-1]*k);dx.stroke()});dx.shadowBlur=0;

var lastB=0;
function frame(now){
